<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>TODO登録</title>
		<link rel="stylesheet" th:href="@{/css/form.css}">
	</head>
	<body>
		
		<div th:replace="~{common/fragments :: header-fragment}"></div>
		
		<main>
			
			<h2>TODO編集</h2>
			
			<form method="POST" th:action="@{/todos/update/{id}(id=${id})}" th:object="${todoForm}">
				
				<div class="input-class" style="margin-bottom: 5px; font-weight: bold;">
					ID：<span th:text="${#numbers.formatInteger(id, 10)}">ID</span>
				</div>
						
				<div class="input-item">
					<label for="title">TODO名 <span class="required">*</span></label>
					<input type="text" id="title" th:field="*{title}" th:value="*{title}" placeholder="例：フィルター機能を作る">
					<div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
				</div>
				
				<div class="input-item">
					<label>担当者 (任意)</label>
					<div class="checkbox-group">
						<span th:each="member : ${members}" class="checkbox-item">
	
							<input type="checkbox" 
								   th:value="${member.id}"
								   th:id="${'member-' + member.id}"
								   th:field="*{assigneeIds}">
								   
						    <label th:for="${'member-' + member.id}"
								   th:text="${member.username}"></label>
	
						</span>
					</div>
				</div>
				
				<div class="input-item">
					<label for="priority">優先度 <span class="required">*</span></label>
					<select th:field="*{priority}">
						<option value="">選択してください</option>
						<option th:each="item : ${T(com.forgeon.todo_app.constant.Priority).values()}"
								th:value="${item}"
								th:text="${item.label}">
						</option>
					</select>
					<div class="error-message" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
				</div>
					
				<div class="input-item">
					<label for="dueDate">期限 <span class="required">*</span></label>
					<input type="date" id="dueDate" th:field="*{dueDate}">
					<div class="error-message" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
				</div>
				
				<div class="input-item">
					<label for="classification">分類 <span class="required">*</span></label>
					<select th:field="*{classification}">
						<option value="">選択してください</option>
						<option th:each="item : ${T(com.forgeon.todo_app.constant.Classification).values()}"
								th:value="${item.name}"
								th:text="${item.label}">
						</option>
					</select>
					<div class="error-message" th:if="${#fields.hasErrors('classification')}" th:errors="*{classification}"></div>
				</div>
				
				<div class="input-item">
					<label for="description">内容 <span class="required">*</span></label>
					<textarea id="description" th:field="*{description}" rows="4"></textarea>
					<div class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
				</div>
				
				<div class="input-items-submit">
					<button type="submit" class="add-btn">登 録</button>
				</div>
								
			</form>
		</main>
		
		<div th:replace="~{common/fragments :: footer-fragment}"></div>
		
	</body>
</html>
