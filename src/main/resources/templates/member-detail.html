<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org"
				xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<meta charset="UTF-8">
		<title>詳細</title>
		<link rel="stylesheet" th:href="@{/css/detail.css}">
	</head>
	<body>
		
		<div th:replace="~{common/fragments :: header-fragment}"></div>
		
		<main>
			
			<h2>メンバー詳細</h2>
			
			<div class="detail-item-label">ID：</div>
			<div class="detail-item-value" th:text="${#numbers.formatInteger(member.id, 10)}">ID</div>
			
			<div class="detail-item-label">ユーザー名：</div>
            <div class="detail-item-value" th:text="${member.username}">山田太郎</div>

            <div class="detail-item-label">メールアドレス：</div>
            <div class="detail-item-value" th:text="${member.email}">aiueo@example.com</div>

            <div class="detail-item-label">パスワード：</div>
            <div class="detail-item-value" th:text="${member.password}" sec:authorize="hasAuthority('ADMIN')"></div>
			<div class="detail-item-value" sec:authorize="!hasAuthority('ADMIN')">******</div>

            <div class="detail-item-label">権限：</div>
            <div class="detail-item-value" th:text="${member.role.label}">管理者</div>

            <div class="detail-item-label">備考：</div>
            <div class="detail-item-value" th:text="${member.remarks}">33333</div>
			
			<div class="operations">
				<a th:href="@{/todos(assigneeId=${member.id})}">TODO一覧</a>
				<th:block th:if="${#authentication.name == member.username or #authorization.expression('hasAuthority(''ADMIN'')')}">
					<a th:href="@{/members/edit/{id}(id=${member.id})}">編 集</a>
					<form th:action="@{/members/delete/{id}(id=${member.id})}" method="get">
						<input type="hidden" th:value="${member.id}">
						<button type="submit">削 除</button>
					</form>
				</th:block>
			</div>
			
		</main>
		
		<div th:replace="~{common/fragments :: footer-fragment}"></div>
		
	</body>
</html>
