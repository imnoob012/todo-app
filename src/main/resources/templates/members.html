<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
				xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<meta charset="UTF-8">
		<title>メンバー一覧</title>
		<link rel="stylesheet" th:href="@{/css/members.css}">
		<script th:src="@{/js/main.js}" defer></script>
	</head>
	<body>
		<div th:replace="~{common/fragments :: header-fragment}"></div>
		
		<main>			
			<div class="main-header">
				<h3>メンバー一覧</h3>
				<a th:href="@{/members/add}" class="add-btn">＋ メンバー追加</a>
			</div>
			<div class="search-area">
			    <div class="search-grid">        
			        <form th:action="@{/members}" method="get" th:object="${memberSearchForm}" class="search-item">
			            <input type="text" th:field="*{id}" placeholder="ID">
					</form>

			        <form th:action="@{/members}" method="get" th:object="${memberSearchForm}" class="search-item">
			            <input type="text" th:field="*{username}" placeholder="名前">
			        </form>

			        <form th:action="@{/members}" method="get" th:object="${memberSearchForm}" class="search-item">
			            <input type="text" th:field="*{email}" placeholder="メールアドレス">
			        </form>

			        <form th:action="@{/members}" method="get" th:object="${memberSearchForm}" class="search-item">
			            <input type="text" th:field="*{password}" placeholder="パスワード">
			        </form>

			        <form th:action="@{/members}" method="get" th:object="${memberSearchForm}" class="search-item">
			            <input type="text" th:field="*{role}" placeholder="権限">
			        </form>

			        <form th:action="@{/members}" method="get" th:object="${memberSearchForm}" class="search-item">
			            <input type="text" th:field="*{remarks}" placeholder="備考">
			        </form>
			    </div>
			</div>
			<table>
				<thead>
					<tr>
						<th data-sort="id">ID</th>
						<th data-sort="username">ユーザー名</th>
						<th data-sort="email">メールアドレス</th>
						<th data-sort="password">パスワード</th>
						<th data-sort="role">権限</th>
						<th data-sort="remarks">備考</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="member : ${members}">
						<td>
							<a th:href="@{/members/{id}(id=${member.id})}" th:text="${#numbers.formatInteger(member.id, 10)}">1</a>
						</td>
						<td th:text="${member.username}">山田太郎</td>
						<td th:text="${member.email}">aiueo@example.com</td>
						<td>
				            <span sec:authorize="hasAuthority('ADMIN')" th:text="${member.password}">パスワード</span>
				            <span sec:authorize="!hasAuthority('ADMIN')">*******</span>
				        </td>
						<td th:text="${member.role.label}">管理者とか</td>
						<td th:text="${member.remarks}">備考ゾーン</td>
					</tr>
				</tbody>
			</table>
			
		</main>
		
		<div th:replace="~{common/fragments :: footer-fragment}"></div>
	</body>
</html>
